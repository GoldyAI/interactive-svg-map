<div class="map-container">
    <!-- SVG World Map -->
    <img src="assets/world-map.svg" alt="World Map" class="world-map" (click)="fetchCountryData('US')">
  
    <!-- Country Info Panel -->
    <div class="country-info" *ngIf="countryInfo">
      <h2>{{ countryInfo.name }}</h2>
      <p><strong>Capital:</strong> {{ countryInfo.capital }}</p>
      <p><strong>Region:</strong> {{ countryInfo.region }}</p>
      <p><strong>Income Level:</strong> {{ countryInfo.incomeLevel }}</p>
      <p><strong>Population:</strong> {{ countryInfo.population }}</p>
      <p><strong>GDP:</strong> {{ countryInfo.gdp | currency:'USD' }}</p>
    </div>
  </div>
